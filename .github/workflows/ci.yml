name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tod
          POSTGRES_PASSWORD: tod
          POSTGRES_DB: tod_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tod" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tod:tod@localhost:5432/tod_test
      DATABASE_URL: postgresql://tod:tod@localhost:5432/tod_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck -w apps/api
      - run: npm run build -w apps/api
      - run: npm test -w apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t tod-api .
      - run: docker build --target web -t tod-web .
